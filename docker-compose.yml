services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: codefusion
      POSTGRES_USER: codefusion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codefusion"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    image: mirzasaikatahmmed/codebase-research-agent:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://codefusion:${POSTGRES_PASSWORD}@db:5432/codefusion
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - repo_cache:/root/.cache/codefusion_repos

volumes:
  db_data:
  repo_cache:
